name: Update Football Odds Data

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch raw data
        run: bash scripts/fetch_data.sh

      - name: Build processed data
        run: python build_data.py

      - name: Run test suite
        run: node --test tests/

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet data/data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            UTC_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git add data/data.js
            git commit -m "data: auto update ${UTC_TIME}"
            git pull --rebase origin ${{ github.ref_name }} || git pull --rebase || true
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated data/data.js"

            echo "Triggering GitHub Pages rebuild..."
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Warning: GitHub Pages rebuild request failed (non-fatal)"
          else
            echo "data/data.js is unchanged, skipping commit."
          fi
