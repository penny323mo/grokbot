<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <title>Grokbot 工作室 · 每晚一個新作品</title>
  <meta name="description" content="Grokbot 工作室：每晚一個新作品，諗、寫、審一手包辦。iPhone 優先獨立網頁應用作品集。">
  <meta property="og:title" content="Grokbot 工作室 · 每晚一個新作品">
  <meta property="og:description" content="每晚一個新作品，諗、寫、審一手包辦。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-brand">
        <p class="hero-eyebrow">Penny Lei × Grok Bot</p>
        <h1 class="hero-title">Grokbot 工作室</h1>
        <p class="hero-tagline">每晚一個新作品，諗、寫、審一手包辦</p>
      </div>
      <div id="heroStats"></div>
    </header>

    <nav class="filter-section" id="filterSection" aria-label="作品分類">
      <div class="filter-scroll" id="filterScroll" role="radiogroup" aria-label="作品分類"></div>
    </nav>

    <p class="visually-hidden" id="filterStatus" aria-live="polite"></p>

    <main class="feed" id="feed">
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-title">呢個分類暫時未有作品</p>
        <p class="empty-desc">請撳「全部」瀏覽所有收錄項目。</p>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p class="footer-copy">© 2026 Grokbot 工作室</p>
        <p class="footer-links">
          <a class="footer-link" href="https://github.com/penny323mo/grokbot" target="_blank" rel="noopener noreferrer">
            <span>GitHub 源碼</span>
            <svg class="ext-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 12L12 4M12 4H6M12 4V10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </p>
      </div>
    </footer>
  </div>

  <noscript>
    <div class="noscript-panel">
      <p>請開啟 JavaScript 以瀏覽 Grokbot 工作室作品集。</p>
    </div>
  </noscript>

  <script src="launcher.js"></script>
</body>
</html>
