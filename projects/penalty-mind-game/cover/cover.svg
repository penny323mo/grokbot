<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#EEECE7"/>
  <!-- Thin geometric pitch markings -->
  <line x1="260" y1="570" x2="720" y2="570" stroke="#5E7186" stroke-width="2.5" stroke-opacity="0.35"/>
  <path d="M 380 570 A 110 110 0 0 1 600 570" fill="none" stroke="#5E7186" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Subtle net fill tint -->
  <polygon points="330,360 375,320 605,320 650,360 650,570 330,570" fill="#5E7186" fill-opacity="0.05"/>

  <!-- Net depth lines -->
  <path d="M 330 360 L 375 320 L 605 320 L 650 360" fill="none" stroke="#5E7186" stroke-width="4" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="375" y1="320" x2="375" y2="530" stroke="#5E7186" stroke-width="3" stroke-opacity="0.3" stroke-linecap="round"/>
  <line x1="605" y1="320" x2="605" y2="530" stroke="#5E7186" stroke-width="3" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Front goal frame -->
  <path d="M 330 570 L 330 360 L 650 360 L 650 570" fill="none" stroke="#5E7186" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle shot trajectory arc -->
  <path d="M 440 520 C 475 490 515 460 550 435" fill="none" stroke="#5E7186" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" stroke-opacity="0.4"/>

  <!-- Ball in flight toward top corner -->
  <circle cx="560" cy="425" r="34" fill="#EEECE7" stroke="#5E7186" stroke-width="8"/>
  <polygon points="560,405 577,417 570,438 550,438 543,417" fill="#5E7186" fill-opacity="0.18" stroke="#5E7186" stroke-width="5" stroke-linejoin="round"/>
  <line x1="560" y1="405" x2="560" y2="391" stroke="#5E7186" stroke-width="5" stroke-linecap="round"/>
  <line x1="577" y1="417" x2="590" y2="412" stroke="#5E7186" stroke-width="5" stroke-linecap="round"/>
  <line x1="570" y1="438" x2="580" y2="451" stroke="#5E7186" stroke-width="5" stroke-linecap="round"/>
  <line x1="550" y1="438" x2="540" y2="451" stroke="#5E7186" stroke-width="5" stroke-linecap="round"/>
  <line x1="543" y1="417" x2="530" y2="412" stroke="#5E7186" stroke-width="5" stroke-linecap="round"/>
</svg>
