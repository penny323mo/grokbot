<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <style>
    :root {
      --bg: #EEECE7;
      --accent: #B0704F;
      --tint-opacity: 0.12;
      --horizon-opacity: 0.15;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1E1E1C;
        --accent: #C48463;
        --tint-opacity: 0.18;
        --horizon-opacity: 0.20;
      }
    }
    .bg { fill: #EEECE7; fill: var(--bg); }
    .tint { fill: #B0704F; fill: var(--accent); fill-opacity: 0.12; fill-opacity: var(--tint-opacity); }
    .horizon { stroke: #B0704F; stroke: var(--accent); stroke-width: 2; stroke-opacity: 0.15; stroke-opacity: var(--horizon-opacity); }
    .ink { stroke: #B0704F; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1E1E1C; }
      .tint { fill: #C48463; fill-opacity: 0.18; }
      .horizon { stroke: #C48463; stroke-opacity: 0.20; }
      .ink { stroke: #C48463; }
    }
  </style>

  <!-- Background canvas -->
  <rect class="bg" width="1600" height="900" fill="#EEECE7"/>

  <!-- Thin horizon line across center -->
  <line class="horizon" x1="0" y1="450" x2="1600" y2="450" stroke="#B0704F" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Centered tint plate (r=150 at cx=800 cy=450) -->
  <circle class="tint" cx="800" cy="450" r="150" fill="#B0704F" fill-opacity="0.12"/>

  <!-- Pen nib icon centered at (800, 450) -->
  <path class="bg ink"
        d="M 800 360 L 745 440 C 738 452 746 476 755 485 L 745 540 L 855 540 L 845 485 C 854 476 862 452 855 440 Z"
        fill="#EEECE7" stroke="#B0704F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="ink" x1="800" y1="360" x2="800" y2="442" stroke="#B0704F" stroke-width="8" stroke-linecap="round"/>
  <circle class="bg ink" cx="800" cy="452" r="10" fill="#EEECE7" stroke="#B0704F" stroke-width="8"/>

  <!-- Sparkle glyphs (prompt creation) -->
  <g class="ink" stroke="#B0704F" stroke-width="8" stroke-linecap="round">
    <!-- Primary star sparkle (top-right) -->
    <line x1="865" y1="345" x2="865" y2="385"/>
    <line x1="845" y1="365" x2="885" y2="365"/>
    <!-- Secondary star sparkle (top-left) -->
    <line x1="735" y1="362" x2="735" y2="388"/>
    <line x1="722" y1="375" x2="748" y2="375"/>
  </g>
  <circle class="tint" cx="885" cy="410" r="6" fill="#B0704F" fill-opacity="0.12"/>
</svg>
