<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <style>
    :root {
      --bg: #EEECE7;
      --accent: #B0704F;
      --tint-opacity: 0.14;
      --arc-opacity: 0.10;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1E1E1C;
        --accent: #C48463;
        --tint-opacity: 0.20;
        --arc-opacity: 0.12;
      }
    }
    .bg { fill: #EEECE7; fill: var(--bg); }
    .tint { fill: #B0704F; fill: var(--accent); fill-opacity: 0.14; fill-opacity: var(--tint-opacity); }
    .arc { stroke: #B0704F; stroke: var(--accent); stroke-opacity: 0.10; stroke-opacity: var(--arc-opacity); }
    .ink { stroke: #B0704F; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1E1E1C; }
      .tint { fill: #C48463; fill-opacity: 0.20; }
      .arc { stroke: #C48463; stroke-opacity: 0.12; }
      .ink { stroke: #C48463; }
    }
  </style>

  <!-- Rounded-rect background in neutral with accent tint -->
  <rect class="bg" width="240" height="240" rx="60" fill="#EEECE7"/>
  <rect class="tint" width="240" height="240" rx="60" fill="#B0704F" fill-opacity="0.14"/>

  <!-- Subtle accent pattern: 2 soft concentric arcs -->
  <circle class="arc" cx="120" cy="120" r="76" fill="none" stroke="#B0704F" stroke-width="2" stroke-opacity="0.10"/>
  <circle class="arc" cx="120" cy="120" r="102" fill="none" stroke="#B0704F" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Pen nib glyph centered at (120, 120), ~45% of tile, stroke 10 in accent, round caps -->
  <path class="bg ink"
        d="M 120 68 L 86 114 C 82 122 87 138 92 144 L 86 172 L 154 172 L 148 144 C 153 138 158 122 154 114 Z"
        fill="#EEECE7" stroke="#B0704F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="ink" x1="120" y1="68" x2="120" y2="114" stroke="#B0704F" stroke-width="10" stroke-linecap="round"/>
  <circle class="bg ink" cx="120" cy="121" r="7" fill="#EEECE7" stroke="#B0704F" stroke-width="8"/>

  <!-- Sparkle glyphs -->
  <line class="ink" x1="162" y1="64" x2="162" y2="86" stroke="#B0704F" stroke-width="8" stroke-linecap="round"/>
  <line class="ink" x1="151" y1="75" x2="173" y2="75" stroke="#B0704F" stroke-width="8" stroke-linecap="round"/>
  <line class="ink" x1="78" y1="74" x2="78" y2="92" stroke="#B0704F" stroke-width="7" stroke-linecap="round"/>
  <line class="ink" x1="69" y1="83" x2="87" y2="83" stroke="#B0704F" stroke-width="7" stroke-linecap="round"/>
  <circle class="tint" cx="174" cy="106" r="5" fill="#B0704F" fill-opacity="0.14"/>
</svg>
